[project]
name = "complaints-intelligence"
version = "0.1.0"
description = "Agentic weekly complaint report generation with fact-grounded, cited output."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Schema at every stage boundary; typed settings.
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
    # The bounded agent graph (architecture section 8).
    "langgraph>=0.2.60,<0.7",
    # BigQuery stand-in: real SQL over Parquet, no infrastructure.
    "duckdb>=1.1,<2",
    "pyarrow>=18,<22",
    # TF-IDF + SVD embeddings and cosine search.
    "numpy>=2.1,<3",
    "scikit-learn>=1.6,<2",
    # The t distribution for the Welch test. Already present transitively via
    # scikit-learn; declared because it is imported directly.
    "scipy>=1.14,<2",
    # Deterministic render node.
    "jinja2>=3.1,<4",
    # Structured logging with run and version identifiers.
    "structlog>=24.4,<26",
    # CLI.
    "typer>=0.15,<0.20",
]

[project.optional-dependencies]
# The only place a vendor SDK is imported, and only when re-recording cassettes.
live = ["google-genai>=1.0,<2"]

[project.scripts]
ci = "complaints_intelligence.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "ruff>=0.9,<0.15",
    "mypy>=1.14,<2",
    "pre-commit>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaints_intelligence"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
    "ANN",       # flake8-annotations
    "S",         # flake8-bandit
    "T20",       # flake8-print
]
ignore = [
    "ANN401",    # Allow Any in narrowly-scoped adapter signatures.
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, and need no return annotations on test functions.
"tests/**" = ["S101", "ANN001", "ANN201", "ANN202", "ANN204"]
# The CLI prints by design; that is its output channel.
"src/complaints_intelligence/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# `disallow_any_unimported` is deliberately NOT set. scikit-learn, duckdb and
# pyarrow ship no type information, so every object crossing those boundaries
# is Any regardless. Enabling it would force a cast at each call site and buy
# nothing: the boundary is narrow (store/ and retrieval/) and the domain
# objects on the near side are all validated Pydantic models.

[[tool.mypy.overrides]]
# These ship no stubs; langgraph ships py.typed but its generics are loose in
# places. Keep the escape hatch narrow and explicit.
module = [
    "langgraph.*",
    "sklearn.*",
    "scipy.*",
    "duckdb.*",
    "pyarrow.*",
    "google.genai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are still type-checked — arguments, returns and fixtures are all
# verified where annotated. What is relaxed is the requirement to annotate
# `-> None` on several hundred test functions, which is boilerplate that
# catches nothing. The package itself stays fully strict.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: requires GEMINI_API_KEY and network; excluded from the default run",
]
